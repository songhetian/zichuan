# 资产管理系统 - Docker Compose 配置（生产：数据库用阿里云 RDS，不用内置 MySQL）
# 环境变量从 .env 文件读取
# 一键部署（构建 + 迁移 + 启动，幂等）：npm run docker deploy
# 仅更新应用代码（不动数据库）：npm run docker update
# 停止服务：npm run docker down      实时日志：npm run docker logs      状态：npm run docker ps
#
# 部署拓扑（方案 A）：
#   阿里云宿主 nginx (80) ──► docker nginx (8080) ──► app (容器内 3000)
#   数据库：阿里云 RDS（DATABASE_URL 由 RDS_* 字段自动组合，见下方 environment）

services:
  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zichuan-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 显式固定生产模式：.env 里若写着 NODE_ENV=development（本地开发用），
      # env_file 会把它带进生产容器，这里覆盖回来，保证部署结果与 .env 内容无关
      NODE_ENV: production
      # 用 :? 做「缺失即失败」：变量未配置时 compose 直接报错退出，
      # 而不是安静地传空值（空 DATABASE_URL / 空 SESSION_SECRET 都会在运行时埋雷）
      # DATABASE_URL 由 RDS_* 字段自动组合（app 及 db-init 内 prisma CLI 共用）
      DATABASE_URL: mysql://${RDS_USER:?未设置 RDS_USER}:${RDS_PASSWORD:?未设置 RDS_PASSWORD}@${RDS_HOST:?未设置 RDS_HOST}:${RDS_PORT:-3306}/${RDS_DATABASE:-asset-manage}
      SESSION_SECRET: ${SESSION_SECRET:?未设置 SESSION_SECRET，请在 .env 中配置一个至少 32 字符的随机串}

  # 数据库初始化（对 RDS 执行 migrate + seed）
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zichuan-db-init
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # DATABASE_URL 由 RDS_* 字段自动组合（app 及 db-init 内 prisma CLI 共用）
      DATABASE_URL: mysql://${RDS_USER:?未设置 RDS_USER}:${RDS_PASSWORD:?未设置 RDS_PASSWORD}@${RDS_HOST:?未设置 RDS_HOST}:${RDS_PORT:-3306}/${RDS_DATABASE:-asset-manage}
      SESSION_SECRET: ${SESSION_SECRET:?未设置 SESSION_SECRET，请在 .env 中配置一个至少 32 字符的随机串}
    command: >
      sh -c "node scripts/docker-init.cjs && node node_modules/prisma/build/index.js migrate deploy && node node_modules/tsx/dist/cli.mjs prisma/seed.ts"
    restart: "no"
    # 不再依赖容器内 mysql：docker-init.cjs 会轮询等待 RDS 端口可达后再建库/迁移

  # Nginx 反向代理（监听 8080，避开阿里云宿主机 nginx 已占用的 80）
  nginx:
    image: nginx:alpine
    container_name: zichuan-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app