# 资产管理系统 - Docker Compose 配置
# 环境变量从 .env 文件读取
# 一键部署（构建 + 迁移 + 启动，幂等）：npm run docker deploy
# 仅更新应用代码（不动数据库）：npm run docker update
# 停止服务：npm run docker down      实时日志：npm run docker logs      状态：npm run docker ps

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: zichuan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asset-manage
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Next.js 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zichuan-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 显式固定生产模式：.env 里若写着 NODE_ENV=development（本地开发用），
      # env_file 会把它带进生产容器，这里覆盖回来，保证部署结果与 .env 内容无关
      NODE_ENV: production
      # 用 :? 做「缺失即失败」：变量未配置时 compose 直接报错退出，
      # 而不是安静地传空值（空 DATABASE_URL / 空 SESSION_SECRET 都会在运行时埋雷）
      DATABASE_URL: ${DOCKER_DATABASE_URL:?未设置 DOCKER_DATABASE_URL，请在服务端 .env 中配置容器内连接串（host 用服务名 mysql）}
      SESSION_SECRET: ${SESSION_SECRET:?未设置 SESSION_SECRET，请在服务端 .env 中配置一个至少 32 字符的随机串}
    depends_on:
      mysql:
        condition: service_healthy

  # 数据库初始化（运行迁移和种子数据）
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zichuan-db-init
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:?未设置 DOCKER_DATABASE_URL，请在服务端 .env 中配置容器内连接串（host 用服务名 mysql）}
      SESSION_SECRET: ${SESSION_SECRET:?未设置 SESSION_SECRET，请在服务端 .env 中配置一个至少 32 字符的随机串}
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "node scripts/docker-init.cjs && node node_modules/prisma/build/index.js migrate deploy && node node_modules/tsx/dist/cli.mjs prisma/seed.ts"
    restart: "no"

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: zichuan-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql_data:
