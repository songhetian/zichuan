# 资产管理系统 - 阿里云宿主机 nginx 反向代理（方案 A 前端入口）
# 使用方式：
#   1. 将下面 server 块加到你已有的 nginx 配置，或 replace 本文件到 conf.d
#   2. 把 server_name 换成你的域名
#   3. docker nginx 已监听 8080，阿里云宿主机 nginx 只需反代到 127.0.0.1:8080
#   4. 重启 nginx：nginx -s reload
#
# 链路：阿里云 nginx (80/443) ──► docker nginx (8080) ──► app (3000)

server {
    listen       80;
    server_name  your-domain.com;   # ← 改成你的域名

    # 静态资源缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存 1 年
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 主应用反向代理
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（Next.js Hot Reload 需要，生产环境可选）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 上传文件大小限制（Excel 导入）
        client_max_body_size 20m;
    }
}
